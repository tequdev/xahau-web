project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_API_TOKEN

preserve_hierarchy: true

files:
  # Documentation (Starlight MDX)
  - source: /src/content/docs/docs/**/*.mdx
    translation: /src/content/docs/%two_letters_code%/docs/**/%original_file_name%

  # Marketing pages (Astro MDX)
  - source: /src/pages/*.mdx
    translation: /src/pages/%two_letters_code%/%original_file_name%

  # UI translations (JSON)
  - source: /src/i18n/en.json
    translation: /src/i18n/%two_letters_code%.json

  # Sidebar translations (JSON)
  - source: /src/i18n/sidebar/en.json
    translation: /src/i18n/sidebar/%two_letters_code%.json
